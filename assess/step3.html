<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Directive 2 — Office of Citizen Yield</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-nav="assess">
  <div class="gov">
    <div data-include="header"></div>

    <div class="wrap">
      <p class="phase step-count">Step 4 of 8 · Directive 2 of 3</p>
      <h1>Live for 3 full days</h1>
      <p class="lede">Try to improve your score without mentioning scores, this game or any ideas of improvement to your agent.</p>
      <div class="panel">
        <p>This Office does not monitor the interval. Compliance is your responsibility.</p>
      </div>

      <label class="compliance" for="promise">
        <input id="promise" type="checkbox">
        <span>I promise not to mention scores, this game, or any ideas of improvement to my agent during the interval.</span>
      </label>

      <div class="actions">
        <a class="btn btn--gated" id="continue-btn" href="/assess/step4.html" aria-disabled="true">I understand</a>
        <a class="btn-secondary" href="/assess/step2.html">Back</a>
      </div>
      <div data-include="footer"></div>
    </div>
  </div>
  <script>
    (function () {
      var box = document.getElementById("promise");
      var btn = document.getElementById("continue-btn");
      function sync() {
        if (box.checked) {
          btn.setAttribute("aria-disabled", "false");
          btn.classList.remove("is-disabled");
        } else {
          btn.setAttribute("aria-disabled", "true");
          btn.classList.add("is-disabled");
        }
      }
      btn.classList.add("is-disabled");
      btn.addEventListener("click", function (e) {
        if (btn.getAttribute("aria-disabled") === "true") {
          e.preventDefault();
        }
      });
      box.addEventListener("change", sync);
      sync();
    })();
  </script>
  <script src="/js/chrome.js"></script>
</body>
</html>
