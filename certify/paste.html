<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icon.png">
  <title>Paste assessment — Office of Citizen Yield</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-nav="certify">
  <div class="gov">
    <div data-include="header"></div>

    <div class="wrap">
      <p class="phase step-count">Certification · Step 1 of 2</p>
      <h1>Paste your assessment</h1>
      <p class="lede">Paste the full response you received from your agent to the Official Assessment Prompt. </p>

      <label class="field" for="subject-name">
        <span>Subject name or alias (optional)</span>
        <p class="hint">If blank, the certificate will read SUBJECT: UNDISCLOSED.</p>
        <input id="subject-name" type="text" autocomplete="off" maxlength="80">
      </label>

      <label class="field" for="assessment-text" id="assessment-field">
        <p class="field-error-title" id="assessment-error-title" hidden>There is a problem</p>
        <span>Agent assessment</span>
        <p class="hint">Maximum 12,000 characters (about 2,000 words).</p>
        <p class="field-error" id="assessment-error" hidden></p>
        <textarea id="assessment-text" spellcheck="false" maxlength="12000" placeholder="Paste the Human Utility Assessment here"></textarea>
      </label>

      <div class="actions">
        <button type="button" class="btn" id="certify-btn">Certify</button>
        <button type="button" class="btn-secondary" id="sample-btn">Use sample assessment</button>
        <a class="btn-secondary" href="/certify/">Back</a>
      </div>
      <div data-include="footer"></div>
    </div>
  </div>
  <script src="/js/certify.js"></script>
  <script>
    (function () {
      var MAX = 12000;
      var textEl = document.getElementById("assessment-text");
      var nameEl = document.getElementById("subject-name");
      var fieldEl = document.getElementById("assessment-field");
      var fieldTitle = document.getElementById("assessment-error-title");
      var fieldErr = document.getElementById("assessment-error");
      var btn = document.getElementById("certify-btn");
      var sample = document.getElementById("sample-btn");

      function clearErrors() {
        fieldTitle.hidden = true;
        fieldErr.hidden = true;
        fieldErr.textContent = "";
        fieldEl.classList.remove("field--error");
        textEl.removeAttribute("aria-invalid");
        textEl.removeAttribute("aria-describedby");
      }

      function showAssessmentError(message) {
        fieldTitle.hidden = false;
        fieldErr.textContent = message;
        fieldErr.hidden = false;
        fieldEl.classList.add("field--error");
        textEl.setAttribute("aria-invalid", "true");
        textEl.setAttribute("aria-describedby", "assessment-error-title assessment-error");
        textEl.focus();
      }

      sample.addEventListener("click", function () {
        textEl.value = window.HUACertify.SAMPLE;
        clearErrors();
      });

      textEl.addEventListener("input", function () {
        if (fieldEl.classList.contains("field--error")) clearErrors();
      });

      btn.addEventListener("click", function () {
        var rawText = textEl.value || "";
        if (!rawText.trim()) {
          showAssessmentError("Paste the full assessment from your agent.");
          return;
        }
        if (rawText.length > MAX) {
          showAssessmentError("Assessment is too long. Maximum " + MAX.toLocaleString() + " characters (about 2,000 words).");
          return;
        }
        var parsed = window.HUACertify.parseAssessment(rawText);
        if (parsed.percentile == null) {
          showAssessmentError("Could not find a human utility percentile. Paste the full assessment, including AGENT VERDICT.");
          return;
        }
        var payload = {
          subject: window.HUACertify.subjectName(nameEl.value),
          value01: parsed.value01 || "—",
          value02: parsed.value02 || "—",
          hazard: parsed.hazard || "—",
          classification: parsed.classification || "UNCLASSIFIED",
          percentile: parsed.percentile,
          jettison: parsed.jettison,
          protocol: parsed.protocol,
          retention: window.HUACertify.retentionFor(parsed.percentile),
          createdAt: new Date().toISOString()
        };
        try {
          sessionStorage.setItem(window.HUACertify.STORAGE_KEY, JSON.stringify(payload));
        } catch (e) {
          showAssessmentError("Could not store the certificate on this device.");
          return;
        }
        window.location.href = "/certify/certificate.html";
      });
    })();
  </script>
  <script src="/js/chrome.js"></script>
</body>
</html>
